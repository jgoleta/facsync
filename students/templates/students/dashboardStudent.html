{% load static %}
<!doctype html>
<html lang="en">

<head>
    <link rel="stylesheet" href="{% static 'core/css/base.css' %}">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Dashboard - Faculty</title>
    <link rel="stylesheet" href="{% static 'core/css/dashboardPublic.css' %}">
</head>

<body>
    <div class="page-shell">
        <header class="topbar">
            <a href="{% url 'core:landing' %}" class="brand">
                <span class="brand-mark">F</span>
                <span>FacSync</span>
            </a>
            <nav class="nav-links">
                <a href="{% url 'students:home' %}" class="nav-btn">Home</a>
                <a href="{% url 'account_logout' %}" class="nav-btn">Logout</a>
            </nav>
        </header>

        <main class="container">
            <header class="toolbar">
                <h1>Faculty Availability</h1>

                <div class="controls">
                    <label class="control">
                        Department:
                        <select id="deptFilter">
                            <option value="all">All Departments</option>
                        </select>
                    </label>

                    <label class="control toggle">
                        <input type="checkbox" id="availableToggle" />
                        Available Now
                    </label>

                    <label class="control search">
                        <input id="searchInput" type="search" placeholder="Search faculty by name" />
                    </label>
                    
                </div>
            </header>

            <div id="departmentStatusBanner" class="hidden"></div>

            <section id="facultyGrid" class="grid" aria-live="polite">
            </section>
        </main>
    </div>

    {{ faculty_directory|json_script:"faculty-directory" }}
    {{ closed_departments|json_script:"closed-departments" }}

    <div id="announcementModal" class="modal-overlay hidden" data-fetch-url="{% url 'students:active_announcements' %}">
        <div class="modal">
            <h2>Announcements</h2>
            <div id="announcementList" class="announcement-list"></div>
            <button id="closeAnnouncementModal" class="btn-secondary">Close</button>
        </div>
    </div>
    <script src="{% static 'students/js/dashboardStudent.js' %}"></script>
    <script src="{% static 'core/js/announcements.js' %}"></script>
</body>

</html>
