{% with current_url=request.resolver_match.url_name %}
<aside class="sidebar">
    <div class="sidebar-header">
        <a href="{% url 'depthead:admin_dashboard' %}" class="brand">
            <span class="brand-mark">F</span>
            <span>FacSync</span>
        </a>
    </div>

    <nav class="sidebar-nav">
        <a href="{% url 'depthead:admin_dashboard' %}"
            class="nav-item{% if current_url == 'admin_dashboard' or current_url == 'admin_dashboard_legacy' %} active{% endif %}">
            <span>Overview</span>
        </a>
        <a href="{% url 'depthead:peak_analytics' %}"
            class="nav-item{% if current_url == 'peak_analytics' or current_url == 'peak_analytics_legacy' %} active{% endif %}">
            <span>Peak Analytics</span>
        </a>
        <a href="{% url 'depthead:faculty_trends' %}"
            class="nav-item{% if current_url == 'faculty_trends' or current_url == 'faculty_trends_legacy' %} active{% endif %}">
            <span>Faculty Trends</span>
        </a>
        <a href="{% url 'depthead:student_behavior' %}"
            class="nav-item{% if current_url == 'student_behavior' or current_url == 'student_behavior_legacy' %} active{% endif %}">
            <span>Student Behavior</span>
        </a>
    </nav>

    <div class="sidebar-divider"></div>

    <nav class="sidebar-nav">
        <a href="{% url 'depthead:faculty_monitoring' %}"
            class="nav-item{% if current_url == 'faculty_monitoring' or current_url == 'faculty_monitoring_legacy' %} active{% endif %}">
            <span>Faculty Monitoring</span>
        </a>
        <a href="{% url 'depthead:admin_faculty' %}"
            class="nav-item{% if current_url == 'admin_faculty' %} active{% endif %}">
            <span>Manage Faculty</span>
        </a>
        <a href="{% url 'depthead:college_settings' %}"
            class="nav-item{% if current_url == 'college_settings' or current_url == 'college_settings_legacy' %} active{% endif %}">
            <span>Settings</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <a href="{% url 'account_logout' %}" class="nav-item">
            <span>Logout</span>
        </a>
    </div>
</aside>
{% endwith %}
