{% if request.user.is_authenticated %}
<span class="account-identity{% if show_profile_icon %} account-identity-with-icon{% endif %}" title="{{ request.user.get_full_name|default:request.user.username }}">
    {% if show_profile_icon %}
    <svg class="account-profile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 21v-2a8 8 0 0 1 16 0v2" />
    </svg>
    {% endif %}
    <span>{{ request.user.get_full_name|default:request.user.username }}</span>
</span>
{% endif %}
