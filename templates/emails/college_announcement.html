{% extends "emails/base_email.html" %}
{% block heading %}College announcement{% endblock %}
{% block body %}
<p style="margin:0 0 24px 0; overflow-wrap:break-word;">Hi {{ name }},</p>
<p style="margin:0 0 4px 0; font-size:13px; color:#5f6b7a;">College</p>
<p style="margin:0 0 20px 0; font-weight:600; overflow-wrap:break-word;">{{ college }}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
    style="table-layout:fixed; background-color:#f2f6fb; border:1px solid #dfe7f2; border-radius:8px;">
    <tr>
        <td style="padding:16px;">
            <p style="margin:0 0 8px 0; font-size:13px; font-weight:600; color:#5f6b7a;">Announcement</p>
            <p style="margin:0; overflow-wrap:break-word;">{{ message|linebreaksbr }}</p>
        </td>
    </tr>
</table>
<p style="margin:16px 0; font-size:13px; color:#5f6b7a;">Expires {{ expiry|date:"M d, Y" }}.</p>
{% endblock %}
{% block button %}
<tr>
    <td align="center" style="padding:8px 40px 24px 40px;">
        <a href="{{ site_url }}/login/"
            style="display:inline-block; background:linear-gradient(45deg,#3b82f6,#0b74de); color:#ffffff; text-decoration:none; font-weight:600; padding:12px 28px; border-radius:999px;">Sign in to FacSync</a>
    </td>
</tr>
{% endblock %}
