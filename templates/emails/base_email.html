<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}FacSync{% endblock %}</title>
</head>

<body style="margin:0; padding:0; background-color:#f2f6fb; font-family: Segoe UI, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
        style="background-color:#f2f6fb; padding:32px 16px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                    style="max-width:560px; background-color:#ffffff; border-radius:16px; overflow:hidden;">

                    <tr>
                        <td style="padding:32px 40px 0 40px; text-align:center;">
                            <span
                                style="display:inline-block; width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#3b82f6,#001e40); vertical-align:middle;"></span>
                            <span
                                style="font-size:20px; font-weight:700; color:#16213e; vertical-align:middle; margin-left:8px;">FacSync</span>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding:24px 40px 8px 40px;">
                            <h1 style="font-size:22px; color:#16213e; margin:0 0 16px 0;">{% block heading %}{% endblock %}</h1>
                            <div style="font-size:15px; line-height:1.6; color:#3d4a5c;">
                                {% block body %}{% endblock %}
                            </div>
                        </td>
                    </tr>

                    {% block button %}{% endblock %}

                    <tr>
                        <td style="padding:24px 40px 32px 40px; border-top:1px solid #dfe7f2; margin-top:24px;">
                            <p style="font-size:13px; color:#5f6b7a; margin:16px 0 0 0;">
                                This is an automated message from FacSync. If you weren't expecting this email, you can
                                safely ignore it.
                            </p>
                        </td>
                    </tr>

                </table>
                <p style="font-size:12px; color:#94a3b8; margin-top:16px;">&copy; {% now "Y" %} FacSync. All rights
                    reserved.</p>
            </td>
        </tr>
    </table>
</body>

</html>
