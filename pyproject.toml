# Vercel installs from this file when present. Keep these pins in sync with
# requirements.txt, which remains supported for local pip installation.
[project]
name = "facsync"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django==6.1.1",
    "psycopg2-binary==2.9.12",
    "python-decouple==3.8",
    "python-dotenv==1.2.3",
    "tldextract==5.3.0",
    "django-allauth[socialaccount]==65.19.2",
    "requests==2.34.2",
    "Pillow==12.3.0",
    "PyJWT==2.13.0",
    "google-genai==2.22.0",
    "pydantic==2.13.5",
    "vercel-queue==0.10.0",
]

[tool.uv]
package = false

# Private Vercel queue consumer.
[[tool.vercel.subscribers]]
entrypoint = "apps.core.consultation_email_worker"
