<div id="analytics-browser" data-label="consultation browser" data-endpoint="{% url 'faculty:consultation_browser_api' %}">
    <button type="button" id="analytics-chat-toggle" aria-label="Open consultation browser" aria-expanded="false" aria-controls="analytics-chat-panel" hidden>
        {% include 'components/_chat_launcher_icon.html' %}
    </button>
    <section id="analytics-chat-panel" role="dialog" aria-labelledby="analytics-chat-title" hidden>
        <header class="analytics-chat-header">
            <div><h2 id="analytics-chat-title">Your consultations</h2><p>Your consultation records and college updates.</p></div>
            <button type="button" id="analytics-chat-close" aria-label="Close consultation browser">&times;</button>
        </header>
        <div id="analytics-chat-messages" role="log" aria-live="polite" aria-relevant="additions text" aria-label="Analytics conversation"></div>
        <div class="analytics-chat-questions" aria-label="Preset questions">
            {% regroup analytics_questions by group as question_groups %}
            {% for group in question_groups %}
            <fieldset><legend>{{ group.grouper }}</legend>
                {% for item in group.list %}<button type="button" data-metric="{{ item.metric }}">{{ item.question }}</button>{% endfor %}
            </fieldset>
            {% endfor %}
        </div>
    </section>
</div>
