{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FacSync | Login</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    <link rel="stylesheet" href="{% static 'core/css/loginPage.css' %}" />
</head>

<body>
    <div class="login-container">
        <div class="login-panel">
            <div class="login-brand">
                <span class="brand-mark">FS</span>
                <div>
                    <p class="brand-label">FacSync</p>
                </div>
            </div>
            {% if messages %}
            {% for message in messages %}
            {% if forloop.last %}
            <p style="color: red;">{{ message }}</p>
            {% endif %}
            {% endfor %}
            {% endif %}
            <form class="login-form">
                <div class="form-header">
                    <h1>Welcome back!</h1>
                    <p>Sign in to your dashboard</p>
                </div>
            </form>

            <a href="{% url 'google_login' %}" style="text-decoration: none;">
                <button type="button" class="btn-secondary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="1"></circle>
                        <path d="M12 1v6m0 6v4m11-9h-6m-6 0H1"></path>
                    </svg>
                    Continue with Your Gbox Account
                </button>
            </a>

            <div class="login-footer">
                <p>Don't have an account? <a href="{% url 'core:register' %}">Register</a></p>
            </div>
        </div>
    </div>
</body>

</html>
