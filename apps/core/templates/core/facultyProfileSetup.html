{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FacSync | Complete Your Profile</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    <link rel="stylesheet" href="{% static 'core/css/loginPage.css' %}" />
    <link rel="stylesheet" href="{% static 'core/css/facultyProfileSetup.css' %}?v=20261109-setup-safety" />
</head>

<body>
    <div class="register-container">
        <div class="register-panel">
            <div class="form-header">
                <h1>Complete your profile</h1>
                <p>Just a few more details before you get started</p>
            </div>

            <form method="post" id="faculty-profile-form">
                {% csrf_token %}
                {{ form.non_field_errors }}
                <div class="form-group">
                    <label for="{{ form.faculty_id.id_for_label }}">Faculty ID</label>
                    {{ form.faculty_id }}
                    {{ form.faculty_id.errors }}
                </div>
                <div class="form-group">
                    <label for="{{ form.office_location.id_for_label }}">Office / Room</label>
                    {{ form.office_location }}
                    {{ form.office_location.errors }}
                </div>
                <button type="submit" class="btn-primary">Continue to Dashboard</button>
            </form>
        </div>
    </div>
<script src="{% static 'core/js/facultyProfileSetup.js' %}?v=20261109-setup-safety"></script>
</body>

</html>
