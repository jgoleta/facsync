{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>FacSync | Faculty Registration</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}" />
    <link rel="stylesheet" href="{% static 'core/css/loginPage.css' %}" />
</head>

<body>
    <div class="register-container">
        <div class="register-panel">
            <div class="form-header">
                <h1>Complete your faculty registration</h1>
                <p>We couldn't find a pre-added account for <strong>{{ email }}</strong>. Fill this out to request
                    access — your College Head will review it.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="{{ form.faculty_id.id_for_label }}">Faculty ID</label>
                    {{ form.faculty_id }}
                </div>
                <div class="form-group">
                    <label for="{{ form.college.id_for_label }}">College</label>
                    {{ form.college }}
                </div>
                <div class="form-group">
                    <label for="{{ form.office_location.id_for_label }}">Office / Room</label>
                    {{ form.office_location }}
                </div>
                <button type="submit" class="btn-primary">Submit for Approval</button>
            </form>
        </div>
    </div>
</body>

</html>
