<form method="get" class="directory-filters" data-directory-filters aria-label="Filter accounts">
  {% if request.user.school.offers_college %}{% if faculty_filters or student_filters %}<label>College<select name="college"><option value="">All colleges</option>{% for college in colleges %}<option value="{{ college.pk }}" {% if college_filter == college.pk|stringformat:'s' %}selected{% endif %}>{{ college.name }}</option>{% endfor %}</select></label>{% endif %}{% endif %}
  <label>Department<select name="department" data-department-filter><option value="">All departments</option>{% if student_filters %}<option value="unassigned" {% if department_filter == 'unassigned' %}selected{% endif %}>No department</option>{% endif %}{% for department in departments %}<option value="{{ department.pk }}" data-student-levels="{{ department.student_levels|join:',' }}" {% if department_filter == department.pk|stringformat:'s' %}selected{% endif %}>{{ department.name }}</option>{% endfor %}</select></label>
  {% if student_filters %}<label>Educational level<select name="student_level" data-student-level-filter><option value="">All levels</option>{% for key, label in student_filter_levels %}<option value="{{ key }}" {% if student_level_filter == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Grade / year<select name="student_year" data-student-year-filter data-selected="{{ student_year_filter }}"{% if not student_level_filter %} disabled{% endif %}><option value="">All grades / years</option></select></label><label>Student ID order<select name="student_id_order"><option value="">Default order</option><option value="asc" {% if student_id_order == 'asc' %}selected{% endif %}>Ascending</option><option value="desc" {% if student_id_order == 'desc' %}selected{% endif %}>Descending</option></select></label>{{ student_year_choices|json_script:'student-filter-year-choices' }}{% endif %}
  {% if faculty_filters %}<label>Office<select name="office"><option value="">All offices</option>{% for office in offices %}<option value="{{ office.pk }}" {% if office_filter == office.pk|stringformat:'s' %}selected{% endif %}>{{ office.name }}</option>{% endfor %}</select></label>{% endif %}
  <noscript><button type="submit" class="btn-secondary">Apply filters</button></noscript>
</form>
